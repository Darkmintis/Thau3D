[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thau3d"
version = "0.1.0"
description = "Describe a place. Get a building you can walk through."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Darkmintis", url = "https://github.com/Darkmintis" }]
keywords = ["architecture", "buildings", "3d", "gltf", "glb", "walkthrough", "procedural", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Construction",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Architectural Engineering",
  "Topic :: Games/Entertainment :: Simulation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
thau3d = "thau3d.cli:main"

[project.urls]
Homepage = "https://github.com/Darkmintis/Thau3D"
Documentation = "https://github.com/Darkmintis/Thau3D#readme"

[tool.hatch.build.targets.wheel]
packages = ["thau3d"]
